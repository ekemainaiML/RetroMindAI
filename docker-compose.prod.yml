services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: retromind
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: retromind
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retromind -d retromind"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:community
    restart: always
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_dbms_memory_pagecache_size: 512M
      NEO4J_dbms_memory_heap_max__size: 2G
    volumes:
      - neo4j_data:/data

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql://retromind:${DB_PASSWORD}@postgres:5432/retromind
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      FRONTEND_URL: https://${DOMAIN}
      UPLOAD_DIR: /app/uploads
      R2_ENDPOINT: https://${OCI_NAMESPACE}.compat.objectstorage.${OCI_REGION}.oraclecloud.com
      R2_ACCESS_KEY: ${OCI_ACCESS_KEY}
      R2_SECRET_KEY: ${OCI_SECRET_KEY}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      ENVIRONMENT: production
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      SENTRY_DSN: ${SENTRY_DSN}
      WORKSHOP_ID: ${WORKSHOP_ID}
      AI_MODEL_PATH: /app/ai/models/vehicle_classifier.onnx
      TORCH_MODEL_PATH: /app/ai/models/mobilenet.pt
      FREECAD_HOST: http://freecad-worker:8100
      ENABLE_CAD_EXPORT: "true"
    volumes:
      - app_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_started
      freecad-worker:
        condition: service_started

  backend-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    restart: always
    environment:
      DATABASE_URL: postgresql://retromind:${DB_PASSWORD}@postgres:5432/retromind
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      UPLOAD_DIR: /app/uploads
      R2_ENDPOINT: https://${OCI_NAMESPACE}.compat.objectstorage.${OCI_REGION}.oraclecloud.com
      R2_ACCESS_KEY: ${OCI_ACCESS_KEY}
      R2_SECRET_KEY: ${OCI_SECRET_KEY}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      ENVIRONMENT: production
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      SENTRY_DSN: ${SENTRY_DSN}
      WORKSHOP_ID: ${WORKSHOP_ID}
      AI_MODEL_PATH: /app/ai/models/vehicle_classifier.onnx
      TORCH_MODEL_PATH: /app/ai/models/mobilenet.pt
      FREECAD_HOST: http://freecad-worker:8100
      ENABLE_CAD_EXPORT: "true"
    volumes:
      - app_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  freecad-worker:
    build:
      context: ./freecad-worker
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8100:8100"
    environment:
      PYTHONPATH: /worker
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  training-scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    restart: always
    command: python -m workers.training_scheduler
    environment:
      DATABASE_URL: postgresql://retromind:${DB_PASSWORD}@postgres:5432/retromind
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
/main
  nginx:
    build:
      context: ./infra/nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - frontend
      - backend-api
    restart: always
/main
/main
    environment:
      NEXT_PUBLIC_API_URL: https://${DOMAIN}/api/v1
    restart: always

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    environment:
      DATABASE_URL: postgresql://retromind:${DB_PASSWORD}@postgres:5432/retromind
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY}
      R2_SECRET_KEY: ${R2_SECRET_KEY}
      FRONTEND_URL: https://${DOMAIN}
      ENVIRONMENT: production
      ADMIN_API_KEY: ${ADMIN_API_KEY}
    volumes:
      - upload_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  backend-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgresql://retromind:${DB_PASSWORD}@postgres:5432/retromind
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      ENVIRONMENT: production
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    volumes:
      - upload_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  neo4j:
    image: neo4j:community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
    volumes:
      - neo4j_data:/data
    restart: always

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: always

volumes:
  postgres_data:
  neo4j_data:
  upload_data:
  certbot_data:
  certbot_www:
/main
/main
