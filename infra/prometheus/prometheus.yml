global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: "retromind-api"
    metrics_path: "/api/v1/metrics"
    static_configs:
      - targets: ["backend-api:8000"]
        labels:
          service: "backend-api"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
