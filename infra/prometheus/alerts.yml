groups:
  - name: retromind-alerts
    interval: 30s

    rules:
      - alert: HighErrorRate
        expr: |
          rate(http_requests_total{status=~"5.."}[5m])
          /
          rate(http_requests_total[5m])
          > 0.05
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "API error rate exceeds 5%"
          description: "Error rate is {{ $value | humanizePercentage }} over the last 5 minutes"

      - alert: HighLatency
        expr: |
          histogram_quantile(0.95, http_request_duration_seconds_bucket) > 5
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "P95 latency exceeds 5 seconds"
          description: "P95 latency is {{ $value }}s over the last 5 minutes"

      - alert: QueueDepthWarning
        expr: rq_queue_depth > 100
        for: 2m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "RQ queue depth exceeds 100"
          description: "Queue depth is {{ $value }}"

      - alert: QueueDepthCritical
        expr: rq_queue_depth > 500
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "RQ queue depth exceeds 500"
          description: "Queue depth is {{ $value }} — workers may be stuck"

      - alert: CircuitBreakerOpen
        expr: circuit_breaker_state{state="open"} > 0
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Circuit breaker open for {{ $labels.service }}"
          description: "Service {{ $labels.service }} circuit breaker has opened"

      - alert: BackupFailed
        expr: backup_success == 0
        for: 1h
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Backup failed"
          description: "The most recent backup attempt failed"

      - alert: DiskSpaceWarning
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) < 0.15
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Disk space below 15%"
          description: "Available disk space is {{ $value | humanizePercentage }}"

      - alert: DiskSpaceCritical
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) < 0.05
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Disk space below 5%"
          description: "Available disk space is {{ $value | humanizePercentage }}"

      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "{{ $labels.job }} is down"
          description: "{{ $labels.instance }} has been unreachable for 1 minute"

      - alert: RateLimitHitHigh
        expr: rate(http_requests_total{status="429"}[5m]) > 10
        for: 5m
        labels:
          severity: warning
          team: product
        annotations:
          summary: "High rate limit rejection rate"
          description: "{{ $value | humanize }} 429 responses per second — consider reviewing tier limits"

      - alert: DatabaseConnectionsHigh
        expr: pg_stat_activity_count > 50
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High database connection count"
          description: "PostgreSQL has {{ $value }} active connections"
