name: CI

on:
  workflow_call:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - run: ruff check . --config ../pyproject.toml

  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install mypy
      - run: mypy api/ core/ --ignore-missing-imports --explicit-package-bases

  migration-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: retromind
          POSTGRES_PASSWORD: retromind
          POSTGRES_DB: retromind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U retromind -d retromind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run migrations forward
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql://retromind:retromind@localhost:5432/retromind
      - name: Rollback one migration
        run: alembic downgrade -1
        env:
          DATABASE_URL: postgresql://retromind:retromind@localhost:5432/retromind
      - name: Re-apply migrations
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql://retromind:retromind@localhost:5432/retromind

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Scan Python dependencies
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --desc
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Scan npm dependencies
        run: |
          cd frontend
          npm audit --audit-level=high

  test:
    needs: [lint]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: retromind
          POSTGRES_PASSWORD: retromind
          POSTGRES_DB: retromind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U retromind -d retromind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: DATABASE_URL=postgresql://retromind:retromind@localhost:5432/retromind python3 -m pytest tests/unit/ -q
        env:
          REDIS_URL: redis://localhost:6379/0
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: retromind

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
