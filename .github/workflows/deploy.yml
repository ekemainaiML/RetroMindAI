name: Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'deploy' to confirm manual deployment"
        required: true
        default: ""

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-check:
    runs-on: ubuntu-latest
    steps:
      - name: Validate confirmation input
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy" ]; then
            echo "::error::Type 'deploy' to confirm the deployment"
            exit 1
          fi
      - name: Validate required secrets
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          DOMAIN: ${{ secrets.DOMAIN }}
        run: |
          MISSING=""
          for var in ORACLE_HOST ORACLE_USER ORACLE_SSH_KEY DOMAIN; do
            if [ -z "${!var}" ]; then
              MISSING="$MISSING $var"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required secrets:$MISSING"
            echo "::error::Add these secrets in GitHub Repository Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "All required secrets are present"

  deploy:
    needs: [secrets-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Oracle Cloud VM
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -e
            cd /app/retromind

            # Pull latest code
            git pull origin main

            # Copy env file from secure location
            cp /app/.env.prod .env.prod

            # Build and restart (ARM64 native on Ampere)
            docker compose -f docker-compose.prod.yml build --pull
            docker compose -f docker-compose.prod.yml up -d

            # Clean up old images
            docker system prune -af --filter "until=24h"

            # Verify services are up
            sleep 10
            docker compose -f docker-compose.prod.yml ps

  smoke-test:
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Smoke test frontend
        run: curl -sfI https://${{ secrets.DOMAIN }} 2>&1 | head -5
      - name: Smoke test API
        run: curl -sf https://api.${{ secrets.DOMAIN }}/api/v1/health 2>&1 | head -5

