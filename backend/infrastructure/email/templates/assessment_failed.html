<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
  <div style="max-width: 600px; margin: 0 auto; padding: 20px;">
    <div style="background: #d93025; color: white; padding: 20px; border-radius: 8px 8px 0 0;">
      <h1 style="margin: 0;">Assessment Failed</h1>
    </div>
    <div style="border: 1px solid #ddd; padding: 20px; border-radius: 0 0 8px 8px;">
      <p>Dear <strong>{{ workshop_name }}</strong>,</p>
      <p>Your vehicle assessment could not be completed.</p>
      <p style="background: #fef7f6; padding: 12px; border-radius: 4px; border-left: 4px solid #d93025;">
        <strong>Error:</strong> {{ error }}
      </p>
      <p style="color: #666; font-size: 12px; margin-top: 20px;">
        Sent by {{ brand_name }}
      </p>
    </div>
  </div>
</body>
</html>
