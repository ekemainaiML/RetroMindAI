<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
  <div style="max-width: 600px; margin: 0 auto; padding: 20px;">
    <div style="background: #f9ab00; color: white; padding: 20px; border-radius: 8px 8px 0 0;">
      <h1 style="margin: 0;">API Key Expiring Soon</h1>
    </div>
    <div style="border: 1px solid #ddd; padding: 20px; border-radius: 0 0 8px 8px;">
      <p>Dear <strong>{{ workshop_name }}</strong>,</p>
      <p>Your API key will expire in <strong>{{ days_left }} day(s)</strong>.</p>
      <p>To avoid service interruption, please generate a new API key from your dashboard.</p>
      <p style="color: #666; font-size: 12px; margin-top: 20px;">
        Sent by {{ brand_name }}
      </p>
    </div>
  </div>
</body>
</html>
