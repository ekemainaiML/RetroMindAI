<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
  <div style="max-width: 600px; margin: 0 auto; padding: 20px;">
    <div style="background: #1a73e8; color: white; padding: 20px; border-radius: 8px 8px 0 0;">
      <h1 style="margin: 0;">Assessment Report Ready</h1>
    </div>
    <div style="border: 1px solid #ddd; padding: 20px; border-radius: 0 0 8px 8px;">
      <p>Dear Customer,</p>
      <p><strong>{{ workshop_name }}</strong> has completed an assessment of your vehicle. You can view the full report through the customer portal.</p>
      <p>
        <a href="{{ portal_url }}" style="display: inline-block; background: #1a73e8; color: white; padding: 12px 24px; text-decoration: none; border-radius: 4px;">
          View Report
        </a>
      </p>
      <p style="color: #999; font-size: 12px;">This link will expire in {{ expires_hours }} hours.</p>
      <p style="color: #666; font-size: 12px; margin-top: 20px;">
        Sent by {{ brand_name }}
      </p>
    </div>
  </div>
</body>
</html>
