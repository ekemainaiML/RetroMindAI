<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
  <div style="max-width: 600px; margin: 0 auto; padding: 20px;">
    <div style="background: #1a73e8; color: white; padding: 20px; border-radius: 8px 8px 0 0;">
      <h1 style="margin: 0;">Daily Digest</h1>
    </div>
    <div style="border: 1px solid #ddd; padding: 20px; border-radius: 0 0 8px 8px;">
      <p>Dear <strong>{{ workshop_name }}</strong>,</p>
      <p>Here is your daily summary:</p>
      <table style="width: 100%; border-collapse: collapse;">
        <tr>
          <td style="padding: 8px; border: 1px solid #ddd;">Assessments Completed</td>
          <td style="padding: 8px; border: 1px solid #ddd; text-align: center;">{{ assessments_count }}</td>
        </tr>
        <tr>
          <td style="padding: 8px; border: 1px solid #ddd;">Assessments Failed</td>
          <td style="padding: 8px; border: 1px solid #ddd; text-align: center; color: {{ 'red' if failed_count > 0 else 'green' }};">{{ failed_count }}</td>
        </tr>
      </table>
      <p style="color: #666; font-size: 12px; margin-top: 20px;">
        Sent by {{ brand_name }}
      </p>
    </div>
  </div>
</body>
</html>
