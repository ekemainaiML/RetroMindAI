services:
  postgres:
    image: postgres:16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: retromind
      POSTGRES_PASSWORD: retromind
      POSTGRES_DB: retromind
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retromind -d retromind"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:community
    ports:
      - "7687:7687"
      - "7474:7474"
    environment:
      NEO4J_AUTH: neo4j/retromind
    volumes:
      - neo4j_data:/data

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://retromind:retromind@postgres:5432/retromind
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: retromind
      R2_ENDPOINT: http://localhost:9000
      R2_ACCESS_KEY: minioadmin
      R2_SECRET_KEY: minioadmin
      FRONTEND_URL: http://localhost:3000
      WORKSHOP_ID: demo-workshop
      AI_MODEL_PATH: /app/ai/models/vehicle_classifier.onnx
      TORCH_MODEL_PATH: /app/ai/models/mobilenet.pt
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
      FREECAD_HOST: http://freecad-worker:8100
      ENABLE_GENERATIVE_DESIGN: "true"
      SMTP_HOST: mailhog
      BACKEND_URL: http://localhost:8000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
    volumes:
      - ./backend:/app
      - /app/__pycache__
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_started
      mailhog:
        condition: service_started

  backend-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgresql://retromind:retromind@postgres:5432/retromind
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: retromind
      WORKSHOP_ID: demo-workshop
      AI_MODEL_PATH: /app/ai/models/vehicle_classifier.onnx
      TORCH_MODEL_PATH: /app/ai/models/mobilenet.pt
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
      FREECAD_HOST: http://freecad-worker:8100
      ENABLE_GENERATIVE_DESIGN: "true"
      SMTP_HOST: mailhog
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/__pycache__
      - ./backend/uploads:/app/uploads

  training-scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    command: python -m workers.training_scheduler
    environment:
      DATABASE_URL: postgresql://retromind:retromind@postgres:5432/retromind
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/__pycache__
      - ./backend/uploads:/app/uploads

  freecad-worker:
    build: ./freecad-worker
    ports:
      - "8100:8100"
    environment:
      - PYTHONPATH=/worker
    volumes:
      - ./freecad-worker:/worker

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
  neo4j_data:
